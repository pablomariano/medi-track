version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medi-track-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    depends_on:
      - mysql
    networks:
      - medi-track-network

  mysql:
    image: mysql:8.0
    container_name: medi-track-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - medi-track-network

  nginx-proxy:
    image: nginx:alpine
    container_name: medi-track-proxy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./docker/ssl:/etc/nginx/ssl
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - medi-track-network

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local
  cache_data:
    driver: local

networks:
  medi-track-network:
    driver: bridge 